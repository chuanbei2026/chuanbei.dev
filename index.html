<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>川北 · chuanbei.dev</title>
<meta name="description" content="川北做的几个小东西：山河纪，一张会动的中国历史地图；东京，慢慢吃，慢慢走，两个人的四天东京。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&display=swap">
<style>
:root{
  --paper:#f6f2e7; --card:#fffdf6; --ink:#23302a; --muted:#6f776e; --line:#ddd8c8;
  --red:#b64b35; --sage:#5f7656; --shadow:0 1px 0 #0000000a,0 14px 40px #2a3a3214;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#171a17; --card:#20241f; --ink:#ece7d8; --muted:#a3a597; --line:#33382f;
  --red:#d9785f; --sage:#9cb38f; --shadow:0 1px 0 #ffffff08,0 14px 40px #0000004d; color-scheme:dark;
}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font:16px/1.65 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Noto Sans SC",sans-serif}
.serif{font-family:"Noto Serif SC","Songti SC","STSong",serif}
main{max-width:1040px;margin:0 auto;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));
  padding-block:clamp(48px,10vw,104px) 48px}
header{display:flex;align-items:center;gap:16px;margin-bottom:clamp(36px,6vw,64px)}
.seal{flex:none;width:52px;height:52px;border-radius:6px;background:var(--red);color:#fff6ea;
  display:grid;place-items:center;font-size:26px;font-weight:700;letter-spacing:0;transform:rotate(-3deg)}
h1{margin:0;font-size:clamp(28px,4.4vw,40px);line-height:1.15;font-weight:700;letter-spacing:.04em}
.sub{margin:4px 0 0;color:var(--muted);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:clamp(18px,3vw,28px)}
a.card{display:flex;flex-direction:column;min-width:0;text-decoration:none;color:inherit;background:var(--card);
  border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);
  transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease}
a.card:hover{transform:translateY(-4px);border-color:color-mix(in srgb,var(--accent) 45%,var(--line))}
a.card:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.shot{aspect-ratio:16/10;max-width:100%;background:var(--line);overflow:hidden;border-bottom:1px solid var(--line)}
.shot img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block;transition:transform .6s ease}
a.card:hover .shot img{transform:scale(1.03)}
.body{display:flex;flex-direction:column;gap:10px;padding:20px 22px 22px}
.kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
h2{margin:0;font-size:24px;line-height:1.3;font-weight:700;text-wrap:balance}
.body p{margin:0;color:var(--muted);font-size:15px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.tags span{font-size:12px;padding:2px 9px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.go{margin-top:6px;display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--accent);font-weight:600}
.go small{color:var(--muted);font-weight:400;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
footer{margin-top:56px;color:var(--muted);font-size:13px;text-align:center}
</style>
</head>
<body>
<main>
  <header>
    <div class="seal serif" aria-hidden="true">川</div>
    <div>
      <h1 class="serif">川北的小站</h1>
      <p class="sub">做着玩的几个小东西，点卡片进去看看</p>
    </div>
  </header>

  <div class="grid">
    <a class="card" href="https://shanheji.chuanbei.dev/" style="--accent:var(--sage)">
      <div class="shot"><img src="shanheji.jpg" alt="山河纪：中国历史版图与大事编年" loading="lazy" width="960" height="600"></div>
      <div class="body">
        <span class="kicker">历史地图</span>
        <h2 class="serif">山河纪</h2>
        <p>从夏商周到清末，沿着真实年份走过王朝、帝王与历史生活，配 173 张疆域形势参考图。</p>
        <div class="tags"><span>公元前 1600 → 1911</span><span>大事编年</span><span>帝王世系</span></div>
        <div class="go"><span>进入山河纪 →</span><small>shanheji.chuanbei.dev</small></div>
      </div>
    </a>

    <a class="card" href="https://tokyo.chuanbei.dev/" style="--accent:var(--red)">
      <div class="shot"><img src="tokyo.jpg" alt="东京，慢慢吃，慢慢走：一张可以探索的东京旅行画" loading="lazy" width="960" height="600"></div>
      <div class="body">
        <span class="kicker">Tokyo for two</span>
        <h2 class="serif">东京，慢慢吃，慢慢走</h2>
        <p>给第一次去日本的两个人：一张可以探索的东京旅行画，四天三晚的美食、街区、地标和详细交通。</p>
        <div class="tags"><span>4 天 3 晚</span><span>两个人</span><span>美食优先</span></div>
        <div class="go"><span>展开东京之旅 →</span><small>tokyo.chuanbei.dev</small></div>
      </div>
    </a>
  </div>

  <footer>chuanbei.dev</footer>
</main>
</body>
</html>
